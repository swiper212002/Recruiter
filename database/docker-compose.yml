version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cs60_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cs60_recruitment
      MYSQL_USER: cs60user
      MYSQL_PASSWORD: cs60password
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - cs60network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cs60_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - cs60network

networks:
  cs60network:
    driver: bridge
